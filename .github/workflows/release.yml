name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: install nsis
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$version" installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/shut-up-setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: mv target/release/shut-up target/release/shut-up-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/release/shut-up-linux-x86_64

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: |
          lipo -create -output target/shut-up-universal \
            target/aarch64-apple-darwin/release/shut-up \
            target/x86_64-apple-darwin/release/shut-up
          chmod +x macos/bundle.sh
          ./macos/bundle.sh target/shut-up-universal target
          ditto -c -k --keepParent "target/Shut up.app" target/shut-up-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/shut-up-macos.zip

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            shut-up-setup.exe
            shut-up-linux-x86_64
            shut-up-macos.zip
          body_path: changelog/${{ github.ref_name }}.md
